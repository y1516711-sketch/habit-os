# Free APK build on GitHub — push this folder to a GitHub repo,
# then: Actions tab → "Build Android APK" → Run workflow → download the APK artifact. Cost: ₹0.
name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-Java@v4
        with: { distribution: temurin, Java-version: 17 }
      - name: Install & build web app
        run: |
          npm install --legacy-peer-deps
          npm run build
          npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HABIT-OS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
